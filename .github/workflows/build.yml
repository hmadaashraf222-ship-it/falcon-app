name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet fpdf2 arabic-reshaper python-bidi

      - name: Initialize Flet App and Build APK
        run: |
          # إنشاء مشروع Flet رسمي جديد بالاسم المناسب
          flet create falcon_project
          
          # نقل ملف الـ main.py الخاص بك إلى داخل مجلد المشروع المنشأ
          cp main.py falcon_project/src/main.py
          
          # الدخول إلى مجلد المشروع وبناء الـ APK هناك لتجنب خطأ الـ root
          cd falcon_project
          flutter pub get
          flet build apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: falcon_project/build/app/outputs/flutter-apk/app-release.apk